<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Primary SEO Meta Tags -->
  <title>{{ page.seo_title | default: "Barak Haryati - Senior Director of Product Security | JFrog" }}</title>
  <meta name="title" content="{{ page.seo_title | default: 'Barak Haryati (ברק הרייתי) - Senior Director of Product Security | JFrog' }}">
  <meta name="description"
    content="{{ page.description | default: 'Barak Haryati (ברק הרייתי) - Senior Director of Product Security at JFrog. Vulnerability researcher, creator of RepoHunter, and active open-source security contributor. Specializing in CI/CD security, GitHub Actions exploitation, supply chain security, and AI security.' }}">
  <meta name="keywords"
    content="{{ page.keywords | default: 'Barak Haryati, ברק הרייתי, JFrog, Product Security, Application Security, AppSec, Cloud Security, CI/CD Security, Supply Chain Security, AI Security, Cybersecurity, Security Leader, Israel, RepoHunter, pwn_request, pull_request_target, Pwn Request, Shai-Hulud, Shai Hulud, GitHub Actions Security, GithubForensicTest, workflow exploitation, repository takeover, secret exfiltration, pipeline misconfiguration, open source security research' }}">
  <meta name="author" content="Barak Haryati">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="{{ page.canonical | default: site.url | append: page.url }}">
  
  <!-- Theme -->
  <meta name="theme-color" content="#0f1419">
  <meta name="color-scheme" content="dark">
  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="{{ site.url }}{{ page.url }}">
  <meta property="og:title" content="{{ page.seo_title | default: 'Barak Haryati (ברק הרייתי) - Senior Director of Product Security | JFrog' }}">
  <meta property="og:description"
    content="{{ page.og_description | default: page.description | default: 'Vulnerability researcher, creator of RepoHunter, and active open-source security contributor. Specializing in CI/CD security, GitHub Actions exploitation, supply chain security, and AI security.' }}">
  <meta property="og:image" content="{{ page.og_image | default: 'https://barak.haryati.io/assets/profile.png' }}">
  <meta property="og:image:type" content="image/png">
  <meta property="og:site_name" content="Barak Haryati">
  <meta property="og:locale" content="en_US">
  <meta property="og:locale:alternate" content="he_IL">
  
  <!-- Twitter -->
  <meta name="twitter:card" content="summary">
  <meta name="twitter:url" content="{{ site.url }}{{ page.url }}">
  <meta name="twitter:title" content="{{ page.seo_title | default: 'Barak Haryati (ברק הרייתי) - Senior Director of Product Security | JFrog' }}">
  <meta name="twitter:description"
    content="{{ page.og_description | default: page.description | default: 'Vulnerability researcher, creator of RepoHunter, and active open-source security contributor. CI/CD security, GitHub Actions exploitation, supply chain security.' }}">
  <meta name="twitter:image" content="{{ page.og_image | default: 'https://barak.haryati.io/assets/profile.png' }}">
  
  <!-- Additional SEO -->
  <meta name="geo.region" content="IL">
  <meta name="geo.placename" content="Israel">
  <meta name="language" content="English">
  
  <!-- Structured Data (JSON-LD) — Person (site-wide) -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Person",
      "name": "Barak Haryati",
      "alternateName": "ברק הרייתי",
      "url": "https://barak.haryati.io",
      "image": "https://barak.haryati.io/assets/profile.png",
      "jobTitle": "Senior Director of Product Security",
      "worksFor": {
        "@type": "Organization",
        "name": "JFrog"
      },
      "knowsAbout": ["Application Security", "Cloud Security", "CI/CD Security", "Supply Chain Security", "AI Security", "Cybersecurity", "GitHub Actions Security", "pull_request_target", "Pwn Request", "Pipeline Security", "Vulnerability Research"],
      "hasCreated": { "@type": "SoftwareApplication", "name": "RepoHunter", "url": "https://barak.haryati.io/repohunter" },
      "sameAs": [
        "https://www.linkedin.com/in/barakharyati",
        "https://github.com/barakharyati"
      ]
    }
    </script>
  <!-- Structured Data (JSON-LD) — GithubForensicTest (site-wide) -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "GithubForensicTest",
      "author": { "@type": "Person", "name": "Barak Haryati", "url": "https://barak.haryati.io" },
      "url": "https://github.com/barakharyati/GithubForensicTest",
      "description": "GithubForensicTest is a forensic security tool that scans GitHub Pull Request diffs at scale to detect secrets, credentials, malicious code injections, and suspicious patterns. Built for vulnerability researchers investigating pull_request_target exploits, Pwn Request attacks, and CI/CD pipeline abuse.",
      "applicationCategory": "SecurityApplication",
      "operatingSystem": "Cross-platform",
      "keywords": "GithubForensicTest, GitHub forensic tool, PR diff scanner, secret detection, credential leak, pull request analysis, vulnerability research, malicious code detection, CI/CD forensics, supply chain forensics, Barak Haryati"
    }
    </script>
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
  
  <!-- Favicon -->
  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛡️</text></svg>">

  <!-- Google Analytics (GA4) -->
  {% if site.google_analytics %}
    {% include google-analytics.html %}
  {% endif %}
</head>

<body>
  <main class="container">
    {{ content }}
  </main>
</body>
</html>
